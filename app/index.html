<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0d11" />
    <meta
      name="description"
      content="amber — Lamptey Odartei Isaiah. Engineer, Software Engineer, Builder of Worlds. Accra, Ghana."
    />
    <!--
      The lamp — a square crop of his own photograph of a caged bulkhead
      fitting. It replaces a generic letter 'A' in an SVG. The crop is tight
      enough that the glow still reads at 16px, and it keeps its own dark
      surround, so it needs no light or dark variant.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-lamp.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      First gallery frame. It is the mobile LCP, and the avif variants already
      exist under /images/optimized. Preload them with the same sizes the
      picture uses so the request starts with the document.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/optimized/lilies-bright-320.avif"
      imagesrcset="/images/optimized/lilies-bright-320.avif 320w, /images/optimized/lilies-bright-640.avif 640w"
      imagesizes="(max-width: 767px) 208px, 300px"
      fetchpriority="high"
    />
    <title>amber — Software Engineer · Builder of Worlds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
